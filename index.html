<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3D6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japón">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Rumbo a Japón · Ahorro semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --ink:#1B2540; --muted:#5D6880;
  --line:#C9D0DC; --indigo:#2B3D6B; --hanko:#C2352B; --hanko-soft:#F6DEDB;
  --ok:#2F6B4F; --warn:#9A5B12;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --surface:#1A2234; --ink:#E7EAF1; --muted:#9AA4BA;
    --line:#2F3A52; --indigo:#8EA6E0; --hanko:#E2584C; --hanko-soft:#3A2228;
    --ok:#6FC39A; --warn:#E3A857; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --surface:#1A2234; --ink:#E7EAF1; --muted:#9AA4BA;
  --line:#2F3A52; --indigo:#8EA6E0; --hanko:#E2584C; --hanko-soft:#3A2228;
  --ok:#6FC39A; --warn:#E3A857; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
html{-webkit-text-size-adjust:100%}
input{font-size:16px}
h1,h2,.num{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Georgia",serif}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1.1;margin:0 0 6px}
h2{font-size:1.4rem;font-weight:600;margin:0 0 14px}
p{margin:0}
.sub{color:var(--muted);max-width:60ch}

/* Hero */
.hero{display:grid;gap:22px;margin-bottom:34px}
.figures{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.saved{font-size:clamp(2.6rem,10vw,4.6rem);font-weight:800;line-height:1;color:var(--ink)}
.of{color:var(--muted);font-size:1.1rem}
.rail{position:relative;height:56px;margin:4px 6px 0}
.rail .track{position:absolute;left:0;right:0;top:22px;height:4px;background:var(--line);border-radius:2px}
.rail .fill{position:absolute;left:0;top:22px;height:4px;background:var(--hanko);border-radius:2px;width:0;transition:width .6s ease}
.station{position:absolute;top:16px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:var(--surface);border:3px solid var(--line)}
.station.done{border-color:var(--hanko)}
.station span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:.78rem;color:var(--muted);white-space:nowrap}
.station.end{width:22px;height:22px;top:13px;margin-left:-11px}
.station.end span{font-weight:700;color:var(--ink)}
.train{position:absolute;top:8px;width:30px;height:30px;margin-left:-15px;border-radius:50%;
  background:var(--hanko);color:#fff;display:grid;place-items:center;font-size:15px;transition:left .6s ease;
  box-shadow:0 0 0 4px var(--paper)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fact b{display:block;font-family:"Shippori Mincho B1",Georgia,serif;font-size:1.5rem;font-weight:600;line-height:1.2}
.fact small{color:var(--muted);font-size:.86rem}

/* Plan */
details.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:34px}
details.plan summary{cursor:pointer;padding:16px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary .verdict{font-weight:500}
.verdict.ok{color:var(--ok)} .verdict.short{color:var(--warn)}
.plan-body{padding:0 18px 18px;display:grid;gap:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.hint{font-size:.88rem;color:var(--muted);max-width:70ch}

/* Stamp card */
.card-head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend{font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:grid;gap:8px}
.week.now{border:2px solid var(--indigo);padding:9px 11px 11px}
.week.past:not(.full){border-style:dashed}
.week .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.week .n{font-weight:700;font-size:.92rem}
.week .d{font-size:.78rem;color:var(--muted)}
.week .amt{font-family:"Shippori Mincho B1",Georgia,serif;font-size:1.2rem;font-weight:600}
.week .amt small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.74rem;color:var(--muted);font-weight:400}
.stamps{display:flex;gap:10px}
.stamp{flex:1;aspect-ratio:1;max-width:58px;border-radius:50%;border:2px dashed var(--line);background:transparent;
  color:var(--muted);font:700 .95rem "Zen Kaku Gothic New",sans-serif;cursor:pointer;display:grid;place-items:center;
  transition:transform .15s ease,background .15s ease}
.stamp:hover{border-color:var(--hanko)}
.stamp.on{border:3px solid var(--hanko);background:var(--hanko-soft);color:var(--hanko);transform:rotate(-12deg)}
.stamp[disabled]{cursor:default;opacity:.6}
.status{font-size:.82rem;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1>Rumbo a Japón</h1>
      <p class="sub" id="subtitle">Cada semana, cada uno sella su casilla cuando aparta su ahorro.</p>
    </div>
    <div class="figures">
      <span class="saved num" id="saved">$0</span>
      <span class="of" id="of">de $100,000</span>
    </div>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div class="facts">
      <div class="fact"><small>Esta semana le toca a cada uno</small><b id="f-week">—</b><small id="f-week-n"></small></div>
      <div class="fact"><small>Les falta para la meta</small><b id="f-left">—</b><small id="f-left-n"></small></div>
      <div class="fact"><small>Si siguen el plan, juntarán</small><b id="f-proj">—</b><small id="f-proj-n"></small></div>
    </div>
  </header>

  <details class="plan" id="plan">
    <summary><span>Ajustar el plan</span><span class="verdict" id="verdict"></span></summary>
    <div class="plan-body">
      <div class="fields">
        <label>Nombre de la persona 1<input id="c-n0" type="text" maxlength="20"></label>
        <label>Nombre de la persona 2<input id="c-n1" type="text" maxlength="20"></label>
        <label>Meta entre los dos (MXN)<input id="c-meta" type="number" min="0" step="1000"></label>
        <label>Primera semana inicia<input id="c-inicio" type="date"></label>
        <label>Número de semanas<input id="c-semanas" type="number" min="1" max="156"></label>
        <label>Monto de la semana 1 (cada uno)<input id="c-base" type="number" min="0" step="5"></label>
        <label>Aumento semanal (cada uno)<input id="c-aumento" type="number" min="0" step="5"></label>
        <label>Tope semanal (cada uno, 0 = sin tope)<input id="c-tope" type="number" min="0" step="50"></label>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </details>

  <section>
    <div class="card-head">
      <h2>Tarjeta de sellos</h2>
      <span class="legend" id="legend">Toca tu círculo para sellar la semana.</span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="status" id="status">Cargando…</p>
  </section>
</div>

<script>
(function(){
  const DEF = {meta:100000, semanas:78, inicio:"2026-10-19", base:20, aumento:20, tope:1000, nombres:["Persona 1","Persona 2"]};
  let state = {cfg:{...DEF, nombres:[...DEF.nombres]}, stamps:{}};
  let canWrite = true;
  const $ = id => document.getElementById(id);
  const fmt = n => "$" + Math.round(n).toLocaleString("es-MX");
  const DAY = 86400000;

  function amount(w){
    const c = state.cfg;
    let a = Number(c.base) + Number(c.aumento) * (w - 1);
    if (Number(c.tope) > 0) a = Math.min(a, Number(c.tope));
    return Math.max(0, a);
  }
  function weekStart(w){
    const d = new Date(state.cfg.inicio + "T12:00:00");
    return new Date(d.getTime() + (w - 1) * 7 * DAY);
  }
  function currentWeek(){
    const d0 = new Date(state.cfg.inicio + "T00:00:00").getTime();
    return Math.floor((Date.now() - d0) / (7 * DAY)) + 1;
  }
  const short = d => d.toLocaleDateString("es-MX", {day:"numeric", month:"short"});
  const initial = s => (String(s || "?").trim()[0] || "?").toUpperCase();

  function render(){
    const c = state.cfg, W = Math.max(1, Math.min(156, Number(c.semanas) || 1));
    let saved = 0, proj = 0, peak = 0;
    for (let w = 1; w <= W; w++){
      const a = amount(w); proj += a * 2; peak = Math.max(peak, a);
      for (let p = 0; p < 2; p++) if (state.stamps[w + "-" + p]) saved += a;
    }
    const meta = Number(c.meta) || 0;
    const pct = meta ? Math.min(1, saved / meta) : 0;
    const cw = currentWeek();

    $("saved").textContent = fmt(saved);
    $("of").textContent = "ahorrados de " + fmt(meta) + " (" + Math.round(pct * 100) + "%)";

    // Rail
    const rail = $("rail");
    rail.innerHTML = '<div class="track"></div><div class="fill" style="width:' + (pct*100) + '%"></div>';
    [[.25,"25%"],[.5,"Mitad"],[.75,"75%"],[1,"Tokio"]].forEach(([v,l])=>{
      const s = document.createElement("div");
      s.className = "station" + (pct >= v ? " done" : "") + (v === 1 ? " end" : "");
      s.style.left = (v*100) + "%";
      const t = document.createElement("span"); t.textContent = l; s.appendChild(t);
      rail.appendChild(s);
    });
    const tr = document.createElement("div"); tr.className = "train"; tr.textContent = "✈"; tr.style.left = (pct*100) + "%";
    rail.appendChild(tr);

    // Facts
    if (cw < 1){ $("f-week").textContent = fmt(amount(1)); $("f-week-n").textContent = "El plan arranca el " + short(weekStart(1)); }
    else if (cw > W){ $("f-week").textContent = "¡Listo!"; $("f-week-n").textContent = "El plan de ahorro ya terminó"; }
    else { $("f-week").textContent = fmt(amount(cw)); $("f-week-n").textContent = "Semana " + cw + " de " + W + " · " + fmt(amount(cw)*2) + " entre los dos"; }
    $("f-left").textContent = fmt(Math.max(0, meta - saved));
    const remainingWeeks = Math.max(0, W - Math.max(0, cw - 1));
    $("f-left-n").textContent = remainingWeeks + " semanas restantes en el plan";
    $("f-proj").textContent = fmt(proj);
    $("f-proj-n").textContent = proj >= meta ? "Superan la meta por " + fmt(proj - meta) : "Les faltarían " + fmt(meta - proj);

    // Verdict + hint
    const v = $("verdict");
    v.className = "verdict " + (proj >= meta ? "ok" : "short");
    v.textContent = proj >= meta ? "El plan sí llega a la meta" : "El plan no alcanza la meta";
    const fin = weekStart(W + 1);
    $("hint").textContent = "El monto más alto por semana es de " + fmt(peak) + " por persona (unos " + fmt(peak * 4.33) +
      " al mes). El ahorro termina la semana del " + short(new Date(fin.getTime() - 7*DAY)) + " de " + new Date(fin.getTime()-7*DAY).getFullYear() +
      ". Si cambian los montos, lo ya sellado se recalcula con el plan nuevo.";

    // Grid
    const grid = $("grid"); grid.innerHTML = "";
    for (let w = 1; w <= W; w++){
      const a = amount(w), full = state.stamps[w+"-0"] && state.stamps[w+"-1"];
      const card = document.createElement("div");
      card.className = "week" + (w === cw ? " now" : "") + (w < cw ? " past" : "") + (full ? " full" : "");
      card.innerHTML = '<div class="top"><span class="n">Semana ' + w + '</span><span class="d">' + short(weekStart(w)) + '</span></div>' +
        '<div class="amt">' + fmt(a) + ' <small>c/u</small></div>';
      const st = document.createElement("div"); st.className = "stamps";
      for (let p = 0; p < 2; p++){
        const key = w + "-" + p, on = !!state.stamps[key], name = c.nombres[p] || ("Persona " + (p+1));
        const b = document.createElement("button");
        b.type = "button"; b.className = "stamp" + (on ? " on" : "");
        b.textContent = initial(name);
        b.setAttribute("aria-pressed", on);
        b.setAttribute("aria-label", name + ", semana " + w + (on ? ", sellada" : ", sin sellar"));
        b.title = name;
        b.disabled = !canWrite;
        b.addEventListener("click", () => {
          if (state.stamps[key]) delete state.stamps[key]; else state.stamps[key] = true;
          save(); render();
        });
        st.appendChild(b);
      }
      card.appendChild(st); grid.appendChild(card);
    }
    $("legend").textContent = "Círculo izquierdo: " + (c.nombres[0]||"Persona 1") + " · derecho: " + (c.nombres[1]||"Persona 2");
  }

  function fillForm(){
    const c = state.cfg;
    $("c-n0").value = c.nombres[0]; $("c-n1").value = c.nombres[1];
    $("c-meta").value = c.meta; $("c-inicio").value = c.inicio; $("c-semanas").value = c.semanas;
    $("c-base").value = c.base; $("c-aumento").value = c.aumento; $("c-tope").value = c.tope;
  }
  function bindForm(){
    const map = {"c-meta":"meta","c-inicio":"inicio","c-semanas":"semanas","c-base":"base","c-aumento":"aumento","c-tope":"tope"};
    Object.entries(map).forEach(([id,k])=>{
      $(id).addEventListener("change", e => {
        const v = e.target.value;
        if (k === "inicio"){ if (v) state.cfg.inicio = v; }
        else state.cfg[k] = Math.max(0, Number(v) || 0);
        save(); render();
      });
    });
    ["c-n0","c-n1"].forEach((id,i)=>$(id).addEventListener("change", e => {
      state.cfg.nombres[i] = e.target.value.trim() || ("Persona " + (i+1)); save(); render();
    }));
  }

  function saveLocal(){ try { localStorage.setItem("ahorro-japon", JSON.stringify(state)); } catch(e){} }
  function loadLocal(){
    try { const s = JSON.parse(localStorage.getItem("ahorro-japon") || "null"); if (s && s.cfg) return s; } catch(e){}
    return null;
  }
  function save(){ saveLocal(); }
  function merge(d){
    if (!d || !d.cfg) return;
    state = {cfg:{...DEF, ...d.cfg, nombres:(d.cfg.nombres || DEF.nombres).slice(0,2)}, stamps:{...(d.stamps||{})}};
  }

  const local = loadLocal(); if (local) merge(local);
  fillForm(); bindForm(); render();
  $("status").textContent = "Guardado en este dispositivo.";

  if ("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
})();
</script>
</body>
</html>
